<!DOCTYPE html>
<html>
  <head>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/lite/dist/lite.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gradio/lite/dist/lite.css" />
  </head>
  <body>
    <gradio-lite>
      <!-- Ensure requirements list lightweight packages supported by Pyodide -->
      <gradio-requirements>
        gradio_client
      </gradio-requirements>

      <gradio-file name="app.py" entrypoint>
import gradio as gr

# Add your lightweight Gradio interface logic here
def respond(query):
    return f"Clinical RAG Query Received: {query}"

demo = gr.Interface(fn=respond, inputs="text", outputs="text")
demo.launch()
      </gradio-file>
    </gradio-lite>
  </body>
</html>
